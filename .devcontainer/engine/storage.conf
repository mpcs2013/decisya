# Storage settings for the agent-sandbox container-engine sidecar (issue #41;
# docs/architecture/agent-sandbox-docker-sidecar.md). Baked into the image; every key not listed
# here keeps Podman's compiled-in default.
[storage]
driver = "overlay"
runroot = "/run/user/1000/containers"
graphroot = "/home/podman/.local/share/containers/storage"

[storage.options]
# No mount_program: native overlayfs in the user namespace worked on the ext4-backed named
# volume at G4 (U-41-6 confirmed -- the Postgres smoke image unpacked and ran with no overlay
# error). fuse-overlayfs and /dev/fuse (ladder step 7) were not needed.
