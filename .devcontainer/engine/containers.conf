# Nested-container defaults for the agent-sandbox container-engine sidecar (issue #41;
# docs/architecture/agent-sandbox-docker-sidecar.md). This file merges with Podman's compiled-in
# defaults (/usr/share/containers/containers.conf); every key not listed here keeps its upstream
# default. Baked into the image (not mounted, not passed via $CONTAINERS_CONF at runtime), so it
# applies with no writable state and survives a read-only rootfs.
[containers]
# Port publishing (Testcontainers' mapped ports) needs pasta, not the "host" netns some upstream
# images default to (G2 note, U-41-7). Verified at G4: `podman run -p ...` publishes on the
# sidecar's own network namespace and is reachable there.
netns = "pasta"

# No systemd and no cgroup delegation inside this rootless-in-rootless engine (G2 note, U-41-8).
# The sidecar's own pids_limit/mem_limit/cpus (compose.docker.yaml) bound every nested container
# together, because nested cgroups are disabled rather than partially/incorrectly delegated.
# NOTE (G4 evidence): "cgroups = disabled" and "pidns = host" are mutually exclusive in this
# Podman version ("containers not creating Cgroups must create a private PID namespace: invalid
# argument"). pidns stays at its default (private); the ladder's step 5a (pidns=host) and step 5b
# (systempaths=unconfined) were both tried and were NOT needed for the Done-when smoke test
# (no nested /proc mount failure was observed once the seccomp.json additions were in place).
cgroups = "disabled"

# crun's keyring-join step needs a kernel keyring facility this sandbox does not grant. Recorded
# failing error before this line: "Error: crun: join keyctl `<key>`: Operation not permitted: OCI
# permission denied" (podman run --rm <image> true). Setting this to false avoided ever having to
# allow keyctl/add_key/request_key in seccomp.json (G4-41-01's stop-rule trigger 4).
keyring = false

log_driver = "k8s-file"

[engine]
# G4-41-16 (should): an audit trail of engine activity independent of the squid log, which sees
# nothing (there is no egress on the `engine` network). Read via `podman events --since` through
# an exec, before the next `up --with-docker` recreates the storage volume (G4-41-04).
events_logger = "file"
