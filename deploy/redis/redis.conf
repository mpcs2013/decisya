# Redis configuration for the deployable stack (issue #120, ADR-0018 D5, G4-120-01).
#
# The BFF session ticket store (Data Protection ciphertext) is the only data. Nothing is
# persisted (ADR-0016 R7): a restart ends every session, on purpose.
#
# Authentication (C-11). Redis refuses to start when `user` directives in this file are combined
# with an `aclfile`, so every user lives in the ACL file `redis_acl`. `stackctl.py secrets init`
# generates it from the single ACL policy in stackctl.py (REDIS_ACL_POLICY), with the BFF's
# password in hash form (#<sha256>), never in clear. The policy, which deploy/tests asserts:
#
#   user default off resetpass resetkeys resetchannels -@all
#       The default user can never log in. `resetpass` also clears `nopass`, so Redis protected
#       mode does not treat the default user as open.
#   user health on nopass -@all +ping
#       The Compose healthcheck (`redis-cli --user health ... ping`). It can only PING, so no
#       credential reaches argv or `docker inspect`.
#   user decisya-bff on #<sha256 of the password> ~decisya:bff:* -@all
#       +get +set +del +expire +pexpire +exists +sadd +srem +smembers +multi +exec +discard
#       +watch +unwatch +ping +echo +client +info +hello
#       The BFF's connection string (ConnectionStrings__redis) carries the clear password.
#
# A missing or malformed ACL file stops Redis at start (fail closed).
aclfile /run/secrets/redis_acl

# Listen on every interface of the container. Reachability is limited by the internal `cache`
# network, whose only members are Redis and the BFF. No port is published.
bind 0.0.0.0 -::*
port 6379
protected-mode yes

# No persistence, no RDB snapshots, no append-only file.
save ""
appendonly no
dir /data

# Sessions are small. A hard ceiling with eviction off: a full store refuses writes (the BFF fails
# closed, bff-session NFR-22) instead of silently evicting a live session.
maxmemory 64mb
maxmemory-policy noeviction

# The container log (rotated by Compose) is the only log.
logfile ""
loglevel notice
