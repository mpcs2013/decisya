services:
  postgres:
    image: "docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"
    environment:
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_superuser_password"
      DECISYA_STACK: "1"
      DECISYA_MIGRATOR_DB_PASSWORD_FILE: "/run/secrets/migrator_db_password"
      DECISYA_KEYCLOAK_DB_PASSWORD_FILE: "/run/secrets/keycloak_db_password"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d postgres"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "20s"
  redis:
    image: "docker.io/library/redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "--user"
        - "health"
        - "--no-auth-warning"
        - "-a"
        - ""
        - "ping"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "5s"
  keycloak:
    image: "quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85"
    entrypoint:
      - "/bin/sh"
      - "/opt/decisya/entrypoint-stack.sh"
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD_FILE: "/run/secrets/keycloak_db_password"
      KC_BOOTSTRAP_ADMIN_USERNAME: "decisya-bootstrap"
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: "/run/secrets/keycloak_bootstrap_admin_password"
      KC_HOSTNAME: "https://${DECISYA_ID_HOST}:${DECISYA_HTTPS_PORT}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_PROXY_TRUSTED_ADDRESSES: "10.120.1.2"
      KC_HEALTH_ENABLED: "true"
      KC_TRUSTSTORE_PATHS: "/etc/decisya/trust/caddy-root.crt"
    depends_on:
      postgres:
        condition: "service_healthy"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3"
      interval: "10s"
      timeout: "5s"
      retries: 15
      start_period: "90s"
  caddy:
    image: "docker.io/library/caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b"
    environment:
      DECISYA_APP_HOST: "${DECISYA_APP_HOST}"
      DECISYA_ID_HOST: "${DECISYA_ID_HOST}"
      DECISYA_API_HOST: "${DECISYA_API_HOST}"
      DECISYA_LAN_SUBNET: "${DECISYA_LAN_SUBNET}"
      DECISYA_WORKSTATION_ADDRESS: "${DECISYA_WORKSTATION_ADDRESS}"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "nc"
        - "-z"
        - "127.0.0.1"
        - "8443"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "10s"
  otel-collector:
    image: "docker.io/otel/opentelemetry-collector:0.161.0@sha256:b6d2b9a85b1029d05b5ad913150c1f014eed4ae99be81a1813ca5ade4a191913"
    networks:
      - "aspire"
  migrator:
    image: "${DECISYA_MIGRATOR_IMAGE}"
    environment:
      DOTNET_ENVIRONMENT: "Production"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres:
        condition: "service_healthy"
      otel-collector:
        condition: "service_started"
    networks:
      - "aspire"
  api:
    image: "${DECISYA_API_IMAGE}"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080;8081"
      AllowedHosts: "${DECISYA_API_HOST}"
      Decisya__Edge__TrustedProxies: "10.120.0.2"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      Api__Jwt__Authority: "https://${DECISYA_ID_HOST}:${DECISYA_HTTPS_PORT}/realms/decisya"
      Api__Jwt__TrustedRootPath: "/etc/decisya/trust/caddy-root.crt"
    depends_on:
      migrator:
        condition: "service_completed_successfully"
      caddy:
        condition: "service_healthy"
      otel-collector:
        condition: "service_started"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "dotnet"
        - "/app/Decisya.Api.dll"
        - "--health-probe"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "20s"
  bff:
    image: "${DECISYA_BFF_IMAGE}"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080;8081"
      AllowedHosts: "${DECISYA_APP_HOST}"
      Decisya__Edge__TrustedProxies: "10.120.0.2"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      Bff__Oidc__Authority: "https://${DECISYA_ID_HOST}:${DECISYA_HTTPS_PORT}/realms/decisya"
      Bff__Api__Address: "https://${DECISYA_API_HOST}:${DECISYA_HTTPS_PORT}"
      Bff__Backchannel__TrustedRootPath: "/etc/decisya/trust/caddy-root.crt"
      Bff__DataProtection__KeyRingPath: "/home/app/keyring"
    depends_on:
      redis:
        condition: "service_healthy"
      caddy:
        condition: "service_healthy"
      api:
        condition: "service_healthy"
      otel-collector:
        condition: "service_started"
    networks:
      - "aspire"
    healthcheck:
      test:
        - "CMD"
        - "dotnet"
        - "/app/Decisya.Bff.dll"
        - "--health-probe"
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "20s"
networks:
  aspire:
    driver: "bridge"
