name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # TODO(devops, 0.16): pin every action to a commit SHA before first merge to main.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Commit messages (Conventional Commits)
        uses: wagoid/commitlint-github-action@v6

      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build --no-restore -warnaserror
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -Eq "High|Critical" vuln.txt

      - name: Unit + architecture tests
        run: dotnet test --no-build --filter "Category!=Integration&Category!=E2E" --logger trx
      - name: Integration tests (Testcontainers)
        run: dotnet test --no-build --filter "Category=Integration" --logger trx

      - name: SPA lint, audit, build
        working-directory: src/Decisya.Web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run build
      - name: Playwright (firefox + chromium, axe)
        working-directory: src/Decisya.Web
        run: |
          npx playwright install --with-deps firefox chromium
          npx playwright test

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: csharp, javascript-typescript }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - run: dotnet build
      - uses: github/codeql-action/analyze@v3

  zap-baseline:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      # TODO(devops, 0.16): bring the Compose stack up from `aspire publish` output, then scan the BFF origin.
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          fail_action: true
