name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly full run (ADR-0015): catches CVEs and advisories published since the last push.
  # github.event.before is empty on both of these events, so `changes` yields ALL.
  schedule:
    - cron: '17 5 * * 1'
  # No inputs, on purpose (S-08): if inputs are ever added, they may reach `run:` only through env:.
  workflow_dispatch:

permissions:
  contents: read

# Every run step gets `bash --noprofile --norc -eo pipefail {0}`. Without this a `cmd | tee` pipeline
# hides the failure of cmd (the Vulnerable packages step was fail-open). No step may override it.
defaults:
  run:
    shell: bash

# A newer push to the same PR or branch cancels the run still in progress. The event is part of the
# group so a scheduled run and a push run on main never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which lanes need to run. Docs-only and tooling-only changes skip build, tests and CodeQL;
  # secret scan and commitlint in build-test still run on every change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.detect.outputs.dotnet }}
      spa: ${{ steps.detect.outputs.spa }}
      images: ${{ steps.detect.outputs.images }}
      fullstack: ${{ steps.detect.outputs.fullstack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect what exists and what changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR runs check out the merge commit, so its first parent is the base branch tip.
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base="$BEFORE"; fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
          else
            changed=ALL   # unknown base (first push, force push, schedule, dispatch): run everything
          fi
          # A file name starting with :: would be read as a workflow command (T-14). Pause command
          # processing with a random token that no PR content can know (H-10); nothing between
          # the two markers may write to $GITHUB_OUTPUT or $GITHUB_ENV (G4-39-33).
          # print-changed: begin
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf 'Changed files:\n%s\n' "$changed"
          echo "::$token::"
          # print-changed: end

          # Files that never affect build output, and that the realm guard (RealmGuardTests) exempts
          # exactly, so guard scope ⊆ trigger (#77, G4-77-05/07).
          # lanes: begin
          ignore='^docs/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|dependabot\.yml$)'
          ignore_md='\.md$'
          code=$( { printf '%s\n' "$changed" | grep -E '(^|/)\.claude/'; printf '%s\n' "$changed" | grep -Ev '(^|/)\.claude/' | grep -Ev "$ignore|$ignore_md"; } || true)
          spa_changed=$(printf '%s\n' "$code" | grep -E '^src/Decisya\.Web/|^\.node-version$|^\.github/workflows/ci\.yml$|^\.github/scripts/dependency_canary\.py$|^\.github/scripts/spa_package_guard\.py$|^ALL$' || true)
          dotnet_changed=$(printf '%s\n' "$code" | grep -Ev '^src/Decisya\.Web/|^\.node-version$' | grep . || true)
          images_changed=$(printf '%s\n' "$changed" | grep -E '^src/Decisya\.AppHost/ContainerImages\.cs$|^\.devcontainer/engine/images\.Dockerfile$|^\.github/image-scan/|^\.github/release/|^\.github/scripts/image_scan\.py$|^\.github/workflows/ci\.yml$|^ALL$' || true)

          # The fullstack lane (issue #123, ADR-0019) works by exclusion, so a new kind of file runs the
          # three full-stack jobs until someone proves it cannot matter: everything in `code` except the
          # agent and sandbox tooling, hooks, the edge and collector files, the deploy tests, and the
          # .github files that do not feed these jobs. ALL (unknown base, schedule, dispatch) passes through.
          fs_excluded='^\.claude/|^\.devcontainer/|^\.pre-commit-config\.yaml$|^deploy/(caddy|otel-collector|tests)/|^\.github/'
          fs_kept='^\.github/workflows/ci\.yml$|^\.github/scripts/(fullstack|zap_policy|spa_package_guard)\.py$|^\.github/zap/'
          fullstack_changed=$( { printf '%s\n' "$code" | grep -Ev "$fs_excluded"; printf '%s\n' "$code" | grep -E "$fs_kept"; } | grep . || true)

          dotnet=false; spa=false; images=false; fullstack=false
          [ -n "$(ls *.sln *.slnx 2>/dev/null)" ] && [ -n "$dotnet_changed" ] && dotnet=true
          [ -f src/Decisya.Web/package.json ] && [ -n "$spa_changed" ] && spa=true
          [ -n "$images_changed" ] && images=true
          [ -n "$(ls *.sln *.slnx 2>/dev/null)" ] && [ -n "$fullstack_changed" ] && fullstack=true
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "spa=$spa" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "fullstack=$fullstack" >> "$GITHUB_OUTPUT"
          # lanes: end

  build-test:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # No job has pull-requests: write, so the PR comment can only fail (D5).
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Same exact version as .pre-commit-config.yaml (#59, G4-59-17; test_gitleaks_parity.py).
          GITLEAKS_VERSION: "8.30.1"

      - name: Lanes
        id: detect
        run: |
          echo "dotnet=${{ needs.changes.outputs.dotnet }}" >> "$GITHUB_OUTPUT"
          echo "spa=${{ needs.changes.outputs.spa }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: steps.detect.outputs.dotnet == 'true'
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - name: Restore
        if: steps.detect.outputs.dotnet == 'true'
        run: dotnet restore
      # Proves the restore audit gate (NuGetAudit + warnings as errors) still fails on a seeded
      # High advisory. Generated at run time, restore only, never built (ADR-0014, issue #28).
      - name: Dependency canary (NuGet)
        if: steps.detect.outputs.dotnet == 'true'
        run: python3 .github/scripts/dependency_canary.py nuget
      - name: Build (warnings as errors)
        if: steps.detect.outputs.dotnet == 'true'
        run: dotnet build --no-restore -warnaserror
      - name: Vulnerable packages
        if: steps.detect.outputs.dotnet == 'true'
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -Eq "High|Critical" vuln.txt
      # global.json selects Microsoft.Testing.Platform, so filters and reports use xunit.v3 MTP options.
      - name: Unit + architecture tests
        if: steps.detect.outputs.dotnet == 'true'
        run: dotnet test --no-build --filter-not-trait "Category=Integration" --filter-not-trait "Category=E2E" --filter-not-trait "Category=AppHost" --report-xunit-trx
      - name: Integration tests (Testcontainers)
        if: steps.detect.outputs.dotnet == 'true'
        # Throwaway values for this step only (#17, G4-17-19): generated and masked here, never
        # written to $GITHUB_ENV/$GITHUB_OUTPUT, and exported only to the dotnet test invocation.
        # Only projects that contain Category=Integration tests run here, so "zero tests ran"
        # (exit 8) stays a failure instead of being ignored; .claude/tests/test_ci_integration.py
        # fails if a project gains Integration tests without being listed.
        run: |
          DECISYA_DEV_USER_PASSWORD="$(openssl rand -hex 24)"
          DECISYA_BFF_CLIENT_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$DECISYA_DEV_USER_PASSWORD"
          echo "::add-mask::$DECISYA_BFF_CLIENT_SECRET"
          for project in tests/Decisya.Identity.Tests/Decisya.Identity.Tests.csproj tests/Decisya.Bff.Tests/Decisya.Bff.Tests.csproj tests/Decisya.Api.Tests/Decisya.Api.Tests.csproj tests/Decisya.Infrastructure.Persistence.Tests/Decisya.Infrastructure.Persistence.Tests.csproj tests/Modules/Decisya.Modules.Tenancy.Tests/Decisya.Modules.Tenancy.Tests.csproj tests/Modules/Decisya.Modules.Entitlements.Tests/Decisya.Modules.Entitlements.Tests.csproj tests/Decisya.Infrastructure.Migrator.Tests/Decisya.Infrastructure.Migrator.Tests.csproj tests/Modules/Decisya.Modules.Audit.Tests/Decisya.Modules.Audit.Tests.csproj; do
            DECISYA_DEV_USER_PASSWORD="$DECISYA_DEV_USER_PASSWORD" \
            DECISYA_BFF_CLIENT_SECRET="$DECISYA_BFF_CLIENT_SECRET" \
              dotnet test --project "$project" --no-build --filter-trait "Category=Integration" --report-xunit-trx
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.detect.outputs.spa == 'true'
        with: { node-version-file: .node-version }
      # Reads files only, before any install runs (#26 M1): a Web-only PR does not start the .NET lane,
      # so SpaPackageTests would not run; this step enforces the same script rules on every SPA run.
      - name: SPA package guard (no install scripts)
        if: steps.detect.outputs.spa == 'true'
        run: python3 .github/scripts/spa_package_guard.py
      - name: SPA install, audit, typecheck, lint, test, build
        if: steps.detect.outputs.spa == 'true'
        working-directory: src/Decisya.Web
        # Playwright runs in the `e2e` job (issue #123), not here.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm audit signatures
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      # Proves the npm audit gate still fails on a seeded High advisory. Runs in a temporary directory
      # outside the repository, resolves metadata only, runs no package script (issue #28).
      - name: Dependency canary (npm)
        if: steps.detect.outputs.spa == 'true'
        run: python3 .github/scripts/dependency_canary.py npm

      # The two commitlint steps run last: the action is a Docker Hub image referenced by tag, with the
      # workspace mounted read-write, so it must not run before any step whose result it could change
      # (S-01, T28-03). A swapped image can still falsify this job's later steps (none) and the Summary.
      # Exact version: the local mirror's goldens come from it (.claude/tests/fixtures/commitlint/
      # source.json; test_commitlint.py checks this pin). Bumping it means regenerating the goldens.
      - name: Commit messages (Conventional Commits)
        id: commitlint
        # Skipped only for Dependabot's own PRs (author, actor and branch all match, #113). This
        # condition must stay identical to the verdict step below: if only this step ran, the PR would
        # pass unchecked (continue-on-error). .claude/tests/test_dependabot.py enforces the match.
        if: >-
          github.event_name == 'pull_request' && !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.actor == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        continue-on-error: true   # the verdict is enforced by the next step, next to the drift check
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1

      # Keeps the local commit-msg/pre-push mirror honest (#59, G4-59-24): same commits, same verdict,
      # or the job fails with "mirror drift". commitlint above stays the gate.
      - name: Commit messages verdict and mirror drift check
        # Same condition as the commitlint step above (#113); must stay identical
        # (enforced by .claude/tests/test_dependabot.py).
        if: >-
          github.event_name == 'pull_request' && !(
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.actor == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.commitlint.outcome }}
        run: |
          if python3 .claude/scripts/commitlint.py --range "$BASE_SHA..$HEAD_SHA" > /dev/null; then mirror=success; else mirror=failure; fi
          echo "commitlint: $OUTCOME, local mirror: $mirror"
          if [ "$OUTCOME" != "$mirror" ]; then
            echo "::error::commitlint mirror drift: CI commitlint says $OUTCOME, .claude/scripts/commitlint.py says $mirror"
            exit 1
          fi
          [ "$OUTCOME" = success ]

      - name: Summary
        run: echo "dotnet=${{ steps.detect.outputs.dotnet }} spa=${{ steps.detect.outputs.spa }}" >> "$GITHUB_STEP_SUMMARY"

  realm-guard:
    # Always-run so SPA-only PRs (the Web filter) and any future trigger drift still run the guard
    # (T77-06). Runs on every event this workflow handles; does not depend on the changes job.
    # This job must stay unconditional: no `needs`, no `if` (G6-77-05).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - run: dotnet test --project tests/Decisya.Identity.Tests --filter-class "Decisya.Identity.Tests.RealmGuardTests"

  claude-config:
    # Lints .claude/ and CLAUDE.md on every run (seconds, no build); on every pull_request also
    # checks the pipeline gates recorded in docs/ai/pipeline/<n>.md, except for Dependabot PRs,
    # which carry no manifest (T80-08, G4-80-13).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Claude Code config
        run: python3 .claude/scripts/lint.py
      - name: Roster is current
        run: python3 .claude/scripts/roster.py --check
      - name: Test hooks and pipeline scripts
        run: python3 -m unittest discover -s .claude/tests -p "test_*.py"
      - name: Pipeline gates
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Exempt only when all three hold: the PR's author is Dependabot, the actor of this
          # very event is Dependabot too (a human push to the same PR runs as that human), and
          # the head branch is one of Dependabot's own (G6-80-05). No expression syntax below:
          # the three values above come from env, already resolved.
          dependabot_head=false
          case "$HEAD_REF" in
            dependabot/*) dependabot_head=true ;;
          esac
          if [ "$PR_AUTHOR" = 'dependabot[bot]' ] && [ "$ACTOR" = 'dependabot[bot]' ] && [ "$dependabot_head" = true ]; then
            echo "Dependabot PRs have no manifest; skipping pipeline gates."
            exit 0
          fi
          # release-please's PR (#119, G4-119-05). A separate branch; the Dependabot test above is untouched.
          # Exempt only when all three hold: the author is github-actions[bot], the head branch is exactly
          # release-please--branches--main--components--decisya, and the diff (event SHAs, no renames, via env) is non-empty and
          # holds only added or modified regular files (mode 100644) from the three release-please files.
          # The actor is not checked: Marco's close and reopen is the event. Anything else falls through to the
          # issue-branch rule below and fails there. The commitlint steps are NOT skipped for this PR.
          if [ "$PR_AUTHOR" = 'github-actions[bot]' ] && [ "$HEAD_REF" = 'release-please--branches--main--components--decisya' ]; then
            release_ok=true
            entries=0
            raw_diff="$(mktemp)"
            if git diff --raw --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$raw_diff"; then
              while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
                entries=$((entries + 1))
                IFS=' ' read -r old_mode new_mode old_sha new_sha status <<< "${meta#:}"
                case "$status" in A|M) ;; *) release_ok=false ;; esac
                [ "$new_mode" = '100644' ] || release_ok=false
                case "$path" in
                  CHANGELOG.md|version.txt|.release-please-manifest.json) ;;
                  *) release_ok=false ;;
                esac
              done < "$raw_diff"
            else
              release_ok=false
            fi
            rm -f "$raw_diff"
            if [ "$release_ok" = true ] && [ "$entries" -gt 0 ]; then
              echo "release-please PR touching only CHANGELOG.md, version.txt and .release-please-manifest.json; skipping pipeline gates."
              exit 0
            fi
            echo "Branch $HEAD_REF is the release-please branch, but the diff is empty or touches more than the three release files."
          fi
          n=$(printf '%s' "$HEAD_REF" | sed -nE 's#^issue/([0-9]+)-.*#\1#p')
          if [ -z "$n" ]; then echo "Branch $HEAD_REF is not issue/<n>-<slug>"; exit 1; fi
          python3 .claude/scripts/gates.py "$n"

  codeql:
    # Kept and widened to security-extended: docs/architecture/ci-hardening.md D4. A green check means
    # the analysis ran and uploaded, not that there are no alerts. Alerts appear in the Security tab and
    # do not block merge (a ruleset code_scanning rule is tracked in #83).
    needs: changes
    if: >-
      github.event.repository.visibility == 'public' &&
      (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.spa == 'true')
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow one, so contents: read is repeated here (S-06).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: csharp, javascript-typescript
          queries: security-extended
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - run: dotnet build
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2

  # Required check (ADR-0015). Needs `changes`, no job-level `if`: the gating is at step level, so a
  # skipped scan still reports success and the job never becomes a second skip-safe job.
  image-scan:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Image CVE scan (High/Critical fail)
        if: needs.changes.outputs.images == 'true'
        run: python3 .github/scripts/image_scan.py

  # The three full-stack jobs (issue #123, ADR-0019). All three are required checks, so each one follows the
  # `image-scan` always-report pattern: needs `changes` only, no job-level `if`, and every step after the
  # checkout gated on the `fullstack` lane, so a PR outside the lane still reports success. No deployment
  # environment, no secret, no cache: the dev password is generated per run inside .github/scripts/fullstack.py
  # (masked first, passed to child processes only). Uploads read only $RUNNER_TEMP/upload/<job>/, which the
  # harness fills after its scan, and are skipped for fork PRs (S-123-05).
  apphost-tests:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: needs.changes.outputs.fullstack == 'true'
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - name: Aspire CLI (exact SDK version, from the csproj)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/fullstack.py install-aspire
      - name: Build (warnings as errors)
        if: needs.changes.outputs.fullstack == 'true'
        run: dotnet build -warnaserror
      - name: AppHost tests (Category=AppHost)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/fullstack.py apphost-tests

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: needs.changes.outputs.fullstack == 'true'
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: needs.changes.outputs.fullstack == 'true'
        with: { node-version-file: .node-version }
      - name: Aspire CLI (exact SDK version, from the csproj)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/fullstack.py install-aspire
      - name: SPA package guard (no install scripts)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/spa_package_guard.py
      - name: SPA install and build
        if: needs.changes.outputs.fullstack == 'true'
        working-directory: src/Decisya.Web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: AppHost build (Release)
        if: needs.changes.outputs.fullstack == 'true'
        run: dotnet build src/Decisya.AppHost/Decisya.AppHost.csproj --configuration Release -warnaserror
      # The Playwright version comes from package-lock.json (--no-install: never fetch another one).
      - name: Playwright browsers (Firefox and Chromium)
        if: needs.changes.outputs.fullstack == 'true'
        working-directory: src/Decisya.Web
        run: npx --no-install playwright install --with-deps firefox chromium
      - name: E2E (AppHost, Playwright, artifact scan)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/fullstack.py e2e
      - name: Upload E2E failure results (scanned and staged by the harness)
        if: needs.changes.outputs.fullstack == 'true' && failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-results
          path: ${{ runner.temp }}/upload/e2e/
          if-no-files-found: ignore
          retention-days: 7

  zap:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: needs.changes.outputs.fullstack == 'true'
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: needs.changes.outputs.fullstack == 'true'
        with: { node-version-file: .node-version }
      - name: Aspire CLI (exact SDK version, from the csproj)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/fullstack.py install-aspire
      - name: SPA package guard (no install scripts)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/spa_package_guard.py
      - name: SPA install and build
        if: needs.changes.outputs.fullstack == 'true'
        working-directory: src/Decisya.Web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: AppHost build (Release)
        if: needs.changes.outputs.fullstack == 'true'
        run: dotnet build src/Decisya.AppHost/Decisya.AppHost.csproj --configuration Release -warnaserror
      - name: ZAP baseline (AppHost, pinned ZAP container, artifact scan, policy)
        if: needs.changes.outputs.fullstack == 'true'
        run: python3 .github/scripts/fullstack.py zap
      - name: Upload ZAP report (scanned and staged by the harness)
        if: needs.changes.outputs.fullstack == 'true' && always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zap-report
          path: ${{ runner.temp }}/upload/zap/
          if-no-files-found: ignore
          retention-days: 7

  # Required check `deploy-guards` (issue #120, G3 G4-120-03, T120-05). Marco adds it to the ruleset's
  # required checks after this merges. It must always run and must never be skipped, because GitHub
  # counts a skipped required job as passed: no `paths:` filter on the workflow, no `needs`, and no
  # job-level or step-level `if:`. It does not use the `changes` lanes either, which ignore docs/ and
  # *.md, exactly where a home-network address gets pasted. deploy/tests/test_ci_workflow.py asserts
  # all of this. DECISYA_DEPLOY_REQUIRE_DOCKER makes a missing Docker a failure instead of a skip.
  deploy-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DECISYA_DEPLOY_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # First and on its own: this step needs neither Docker nor .NET, so an address leak is reported
      # even when a later step fails to start.
      - name: Home-network address scan
        run: python3 -m unittest discover -s deploy/tests -p "test_no_home_addresses.py" -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
          dotnet-quality: preview
      # Drift: the AppHost's own publish operation (no Aspire CLI, S-120-06) must write exactly the
      # committed Compose file. The built DLL is run directly: `dotnet run` on this AppHost is taken over
      # by the Aspire CLI where one is installed, and then ignores the publish arguments.
      - name: Drift check (a fresh publish equals deploy/compose/docker-compose.yaml)
        run: |
          dotnet build src/Decisya.AppHost/Decisya.AppHost.csproj --configuration Release -warnaserror
          # Directory.Build.props may move ArtifactsPath outside the repository, so ask MSBuild.
          dll=$(dotnet msbuild src/Decisya.AppHost/Decisya.AppHost.csproj -getProperty:TargetPath -p:Configuration=Release)
          test -n "$dll" || { echo "::error::MSBuild returned no TargetPath for Decisya.AppHost"; exit 1; }
          test -f "$dll" || { echo "::error::Decisya.AppHost.dll was not found at the TargetPath MSBuild reported: $dll"; exit 1; }
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          timeout 300 dotnet "$dll" --operation publish --step publish --output-path "$out"
          written=$(find "$out" -mindepth 1 -printf '%P\n' | sort)
          test "$written" = "docker-compose.yaml" || { echo "::error::the publish wrote files other than docker-compose.yaml (no environment file may be written)"; printf '%s\n' "$written"; exit 1; }
          diff -u deploy/compose/docker-compose.yaml "$out/docker-compose.yaml" || { echo "::error::deploy/compose/docker-compose.yaml has drifted from the AppHost model: publish again and commit the result"; exit 1; }
      # The D10 guards: merged Compose configuration (committed files, and an assembled folder with
      # documentation-range values), `caddy adapt` in the pinned image, stackctl.py, the exceptions file
      # and the scan aliases. Needs Docker; the job fails, not skips, without it.
      - name: Deploy guards (Compose, Caddyfile, stackctl, address scan)
        run: python3 -m unittest discover -s deploy/tests -p "test_*.py" -v
