name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

# A newer push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which lanes need to run. Docs-only and tooling-only changes skip build, tests and CodeQL;
  # secret scan and commitlint in build-test still run on every change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.detect.outputs.dotnet }}
      spa: ${{ steps.detect.outputs.spa }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect what exists and what changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR runs check out the merge commit, so its first parent is the base branch tip.
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base="$BEFORE"; fi
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
          else
            changed=ALL   # unknown base (first push, force push): run everything
          fi
          # A file name starting with :: would be read as a workflow command (T-14). Pause command
          # processing with a random token that no PR content can know (H-10); nothing between
          # the two markers may write to $GITHUB_OUTPUT or $GITHUB_ENV (G4-39-33).
          # print-changed: begin
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf 'Changed files:\n%s\n' "$changed"
          echo "::$token::"
          # print-changed: end

          # Files that never affect build or test output. Anything not listed here counts as code.
          ignore='^docs/|\.md$|^\.claude/|^\.vscode/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|dependabot\.yml$|workflows/claude-review\.yml$)'
          code=$(printf '%s\n' "$changed" | grep -Ev "$ignore" || true)
          spa_changed=$(printf '%s\n' "$code" | grep -E '^src/Decisya\.Web/|^\.node-version$|^\.github/workflows/ci\.yml$|^ALL$' || true)
          dotnet_changed=$(printf '%s\n' "$code" | grep -Ev '^src/Decisya\.Web/|^\.node-version$' | grep . || true)

          dotnet=false; spa=false
          [ -n "$(ls *.sln *.slnx 2>/dev/null)" ] && [ -n "$dotnet_changed" ] && dotnet=true
          [ -f src/Decisya.Web/package.json ] && [ -n "$spa_changed" ] && spa=true
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "spa=$spa" >> "$GITHUB_OUTPUT"

  build-test:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      # TODO(devops, 0.16): pin every action to a commit SHA before Phase 0 exit.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      - name: Lanes
        id: detect
        run: |
          echo "dotnet=${{ needs.changes.outputs.dotnet }}" >> "$GITHUB_OUTPUT"
          echo "spa=${{ needs.changes.outputs.spa }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        if: steps.detect.outputs.dotnet == 'true'
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - name: Restore
        if: steps.detect.outputs.dotnet == 'true'
        run: dotnet restore
      - name: Build (warnings as errors)
        if: steps.detect.outputs.dotnet == 'true'
        run: dotnet build --no-restore -warnaserror
      - name: Vulnerable packages
        if: steps.detect.outputs.dotnet == 'true'
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -Eq "High|Critical" vuln.txt
      # global.json selects Microsoft.Testing.Platform, so filters and reports use xunit.v3 MTP options.
      - name: Unit + architecture tests
        if: steps.detect.outputs.dotnet == 'true'
        run: dotnet test --no-build --filter-not-trait "Category=Integration" --filter-not-trait "Category=E2E" --filter-not-trait "Category=AppHost" --report-xunit-trx
      - name: Integration tests (Testcontainers)
        if: steps.detect.outputs.dotnet == 'true'
        # Exit code 8 = zero tests ran; expected until the first integration test lands.
        # TODO: remove --ignore-exit-code 8 when the first Category=Integration test
        # lands. Left in place, it would silently no-op this gate if the trait filter
        # ever broke (e.g. a typo'd trait) instead of failing the build.
        run: dotnet test --no-build --filter-trait "Category=Integration" --report-xunit-trx --ignore-exit-code 8

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.spa == 'true'
        with: { node-version-file: .node-version }
      - name: SPA lint, audit, build
        if: steps.detect.outputs.spa == 'true'
        working-directory: src/Decisya.Web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run build
      - name: Playwright (firefox + chromium, axe)
        if: steps.detect.outputs.spa == 'true'
        working-directory: src/Decisya.Web
        run: |
          npx playwright install --with-deps firefox chromium
          npx playwright test

      - name: Summary
        run: echo "dotnet=${{ steps.detect.outputs.dotnet }} spa=${{ steps.detect.outputs.spa }}" >> "$GITHUB_STEP_SUMMARY"

  claude-config:
    # Lints .claude/ and CLAUDE.md on every run (seconds, no build); on issue/<n>-* PR branches
    # also checks the pipeline gates recorded in docs/ai/pipeline/<n>.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint Claude Code config
        run: python3 .claude/scripts/lint.py
      - name: Test hooks and pipeline scripts
        run: python3 -m unittest discover -s .claude/tests -p "test_*.py"
      - name: Pipeline gates
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'issue/')
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          n=$(printf '%s' "$HEAD_REF" | sed -nE 's#^issue/([0-9]+)-.*#\1#p')
          if [ -z "$n" ]; then echo "Branch $HEAD_REF is not issue/<n>-<slug>"; exit 1; fi
          python3 .claude/scripts/gates.py "$n"

  codeql:
    # Requires GitHub Advanced Security on private repos; enable in issue 0.16 or delete this job.
    needs: changes
    if: >-
      github.event.repository.visibility == 'public' &&
      (needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.spa == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: csharp, javascript-typescript }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: preview
      - run: dotnet build
      - uses: github/codeql-action/analyze@v4

  zap-baseline:
    # Enabled in issue 0.16 once the Compose stack can be started in CI.
    if: false
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          fail_action: true
