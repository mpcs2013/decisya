name: Caddy image

# Self-built Caddy edge image (#188, ADR-0021, docs/architecture/self-built-caddy.md, threat model M-1, M-2, M-4, M-5).
# Modelled on release.yml (#119): the same controls G4-119-01, -02, -04, per-job permissions, an exact verify identity.
# Triggers are an exact allow-list: push to main (build, publish, sign, verify), workflow_dispatch with no inputs
# (a dry run on main, tagged dryrun-<12 hex>, never pinnable) and pull_request (build and pre-push checks only).
# No other trigger may be added: no PR-target trigger (the `_target` variant of pull_request), workflow_call, workflow_run or schedule (G3 M-2 a). A reusable
# workflow's certificate would carry the callee's ref.
#
# Pin rule (G3 M-2 e): ContainerImages.cs may carry only a digest that a push run of this workflow published for the
# commit named in the tag, and whose verify job was green. Read the digest from that run's publish output, never from
# a tag lookup, and record the run id. `python .github/scripts/caddy_image.py verify-command` prints the consumer
# command. See docs/runbooks/caddy-image.md.
#
# Every action is pinned by commit SHA with its tag (ADR-0014). Only actions already pinned in release.yml are used.
on:
  push:
    branches: [main]
    paths:
      - deploy/caddy/image/**
      - .github/workflows/caddy-image.yml
      - .github/scripts/caddy_image.py
  # No inputs, on purpose: if inputs are ever added, they may reach `run:` only through env:.
  # A dry run on main: builds, pushes dryrun-<12 hex>, signs and verifies. Its image never verifies as a push image.
  workflow_dispatch:
  # Build only: archive, every pre-push check, SBOM. Nothing is pushed or signed.
  pull_request:
    paths:
      - deploy/caddy/image/**
      - .github/workflows/caddy-image.yml
      - .github/scripts/caddy_image.py
      - .github/scripts/release_images.py
      - .github/scripts/image_scan.py
      - .github/release/**
      - .github/image-scan/Dockerfile

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: caddy-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Builds on a read-only token and no secret. Everything it produces is scanned here and handed to `publish` as one
    # artifact of this run (G4-119-04). A dispatch outside main builds nothing.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.inspect.outputs.tag }}
      caddy_config: ${{ steps.inspect.outputs.caddy_config }}
      caddy_sha256: ${{ steps.inspect.outputs.caddy_sha256 }}
    steps:
      # The build commit is github.sha, never an action output (G4-119-01). Pull requests use the default merge ref.
      - name: Check out the pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pushed commit
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Static checks of the build inputs, before any Docker or Go step: the Dockerfile pins and rules, go.mod,
      # main.go and the directory listing (G3 M-1 a to e).
      - name: Check the build inputs
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/caddy_image.py inputs

      # Go checks inside the pinned builder container only: the go line against Caddy's own, and our build list
      # against the upstream build list of the same Caddy version. Every difference must be an annotated override.
      - name: Compare the build list with upstream
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/caddy_image.py buildlist

      - name: Build the image archive (no push)
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/caddy_image.py build

      # Canary, config and file checks, per-layer gitleaks, version binding, caddy list-modules against modules.txt,
      # grype with strict D-2 and syft. Any failure stops before anything is pushed.
      - name: Pre-push checks and SBOM
        id: inspect
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/caddy_image.py inspect

      # Pull requests upload nothing: a fork run can never plant an artifact that `publish` could read.
      - name: Upload the archive and SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: caddy-image
          path: ${{ runner.temp }}/caddy/out/
          if-no-files-found: error
          retention-days: 7

  publish:
    # The only job with packages: write and id-token: write. It runs no Go, no `docker build` and no third-party
    # action: a sparse checkout (pins and scripts only), download-artifact, the docker CLI and the pinned cosign image.
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/release/
            .github/scripts/release_images.py
            .github/scripts/caddy_image.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Exact name; no run-id, github-token, pattern or merge-multiple (G4-119-04).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: caddy-image
          path: ${{ runner.temp }}/caddy-in
      # Login after the download (S-119-02). The credentials live in their own directory.
      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Load, push and check the pushed config digest
        id: push
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CADDY_CONFIG: ${{ needs.build.outputs.caddy_config }}
          CADDY_SHA256: ${{ needs.build.outputs.caddy_sha256 }}
        run: python3 .github/scripts/caddy_image.py push
      - name: Sign and attest by digest
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CADDY_DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 .github/scripts/caddy_image.py sign
      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: docker logout ghcr.io || true

  verify:
    # Verifies with the exact identity of this workflow, the GitHub OIDC issuer, the push trigger and the build
    # commit. An unsigned base, our image under the release.yml identity and (dry run) a dry-run image taken for a
    # push image must all fail.
    needs: publish
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/release/
            .github/scripts/release_images.py
            .github/scripts/caddy_image.py
            deploy/caddy/image/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Verify the signature and attestation, and prove the negative cases
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          CADDY_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 .github/scripts/caddy_image.py verify
      - name: Log out of GHCR
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: docker logout ghcr.io || true
