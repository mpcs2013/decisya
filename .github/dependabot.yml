version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # init and analyze must move together (#247; #209 and #210 each failed alone).
    groups:
      codeql: { patterns: ["github/codeql-action/*"] }
    commit-message: { prefix: "chore", include: "scope" }
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      aspire: { patterns: ["Aspire.*"] }
      opentelemetry: { patterns: ["OpenTelemetry.*"] }
      efcore: { patterns: ["Microsoft.EntityFrameworkCore.*", "Npgsql.*"] }
    commit-message: { prefix: "chore", include: "scope" }
    # Ostium.* is on a private GitHub Packages feed (#164, ADR-0019 A6, G3 S-6). Dependabot reaches a private
    # feed only through a `registries` entry whose token is a Dependabot secret holding a personal access
    # token; the repository's GITHUB_TOKEN is not available to it. No PAT and no Dependabot secret is added,
    # so no registry is declared and Ostium bumps are made by hand under the A3 check (never auto-merged).
    # Marco decides whether to accept this gap or change ADR-0019. Remaining on the first Dependabot NuGet
    # run: whether the updater can still resolve the projects whose graph includes Ostium.*, and whether it
    # rewrites packages.lock.json (see docs/runbooks/ci-security-gates.md, "Dependabot and the private feed").
    ignore:
      - dependency-name: "Ostium.*"
  # Hook revisions in .pre-commit-config.yaml (#59, G4-59-19). A gitleaks bump fails
  # test_gitleaks_parity.py until ci.yml's GITLEAKS_VERSION is bumped in the same PR.
  # The rev is a frozen commit SHA with a "# frozen: vX.Y.Z" comment (ADR-0014, issue #28).
  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
  - package-ecosystem: npm
    directory: /src/Decisya.Web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # React 19 refuses mismatched react and react-dom versions (#247; #201 and #203 each failed alone).
    groups:
      react: { patterns: ["react", "react-dom"] }
    commit-message: { prefix: "chore", include: "scope" }
    # TS 7 and ESLint 10 fail `npm ci` (ERESOLVE): typescript-eslint and eslint-plugin-jsx-a11y
    # peer ranges do not allow them yet (#106, #107). Lift per docs/runbooks/main-ruleset.md.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  # Agent sandbox devcontainer images (ADR-0010, issue #36, G4-15). Two directories because
  # Dependabot's docker ecosystem scans one Dockerfile-containing directory per entry, not
  # recursively: the workspace image and the egress proxy image are pinned separately.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
  - package-ecosystem: docker
    directory: /.devcontainer/egress
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
  # Agent sandbox container-engine sidecar (ADR-0010 amendment, issue #41, G4-41-13). Covers both
  # the engine's own Dockerfile (quay.io/podman/stable) and images.Dockerfile (the digest-pinned
  # test-image allow-list, never built) -- Dependabot's docker ecosystem scans every
  # Dockerfile-shaped file in a directory, not only one named "Dockerfile".
  - package-ecosystem: docker
    directory: /.devcontainer/engine
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
    # Keycloak must change in images.Dockerfile and src/Decisya.AppHost/ContainerImages.cs in one
    # PR (ContainerImageParityTests); a Dependabot bump touches only the Dockerfile (#105).
    # Dependabot names the dependency without the registry (quay.io). Bump by hand per
    # docs/runbooks/ci-security-gates.md ("Image CVE scan").
    ignore:
      - dependency-name: "keycloak/keycloak"
      # Like Keycloak, the collector must change in images.Dockerfile and src/Decisya.AppHost/ContainerImages.cs
      # in one PR (ContainerImageParityTests), so a Dependabot bump of the Dockerfile alone always fails; #206
      # also picked an architecture-specific `-386` tag (#247). Bump by hand.
      - dependency-name: "otel/opentelemetry-collector"
      # Our own image (#188, ADR-0021 item 8): the `caddy` line is a digest published by caddy-image.yml and moves by
      # hand after a publish run, like Keycloak. It does not exist upstream, so no bump could be right.
      - dependency-name: "mpcs2013/decisya-caddy"
  # The self-built Caddy edge image (#188, ADR-0021 item 8, G2 D7). The inputs live under deploy/, because
  # Dependabot could not open PRs for docker entries under .github/ (#83, 2026-10-17). Dockerfile: the Go builder,
  # BusyBox and distroless. The Go minor moves by hand together with a Caddy bump, so the golang entry ignores
  # semver-minor and semver-major; a Go security point release inside the cooldown follows the T2 rule in
  # docs/runbooks/caddy-image.md (hand PR, golang line only, Marco's own approval). caddy-image.yml runs its build on
  # every pull request for these paths, so a bump that breaks a check shows red before merge.
  - package-ecosystem: docker
    directory: /deploy/caddy/image
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Dependabot names Docker Hub official images with the `library/` prefix (#247, #207); both names are kept
      # because the docs do not say which one the matcher uses.
      - dependency-name: "library/golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Go modules of the same folder: version updates for Caddy releases only. Other modules (the golang.org/x/net
  # override included) change by a hand override annotated in go.mod (ADR-0021 item 3) or by Dependabot security
  # updates (a repository setting, no cooldown). A security update that touches go.mod must add the override
  # annotation in the same PR, or caddy-image.yml fails (G3 S-1). Whether `allow` also filters security updates for
  # indirect modules is not documented clearly; it is checked on the first Dependabot run (see the runbook).
  - package-ecosystem: gomod
    directory: /deploy/caddy/image
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
    allow:
      - dependency-name: "github.com/caddyserver/caddy/v2"
  # The image-CVE scanner pin (ADR-0015, issue #28): one digest-pinned FROM line, never built.
  # A bump here changes the scanner only; the scanned images stay in ContainerImages.cs.
  - package-ecosystem: docker
    directory: /.github/image-scan
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
  # The ZAP baseline scanner pin (ADR-0020, issue #123): one digest-pinned FROM line, never built. A bump
  # here changes the scanner only. ZAP is a CI tool, not a scan target (ADR-0015).
  - package-ecosystem: docker
    directory: /.github/zap
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore", include: "scope" }
  # Release pins (#119, ADR-0017, S-119-01): base-images.Dockerfile (aspnet, runtime) and tools.Dockerfile
  # (syft, cosign, gitleaks), never built. The prefix is "fix", not "chore": release-please does not release on
  # chore commits, so a base-image CVE fix would merge and ship in no image. A gitleaks bump fails
  # test_gitleaks_parity.py until GITLEAKS_VERSION and the pre-commit frozen rev move in the same PR. A .NET
  # major stays an ADR-level change.
  - package-ecosystem: docker
    directory: /.github/release
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "fix", include: "scope" }
    ignore:
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/runtime"
        update-types: ["version-update:semver-major"]
